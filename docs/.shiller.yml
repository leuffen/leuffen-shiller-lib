version: 1.0

# .shiller.yml liegt immer im Repository-/Projekt-Root, nicht im Document Root.
# Relative Pfade ab hier; regulär innerhalb des Projekts (kein ../ nach außen).
# Document Root separat festlegen (CLI-Standard: docs/).

# --- Website ---

# Pflicht: Adaptername:Version; jekyll-polyglot:1.0 oder jekyll-legacy:1.0.
adapter: jekyll-polyglot:1.0

# Polyglot: Sprachcodes; Default aus _config.yml, sonst Hauptsprache.
languages: [de, en]

# Polyglot: Hauptsprache (Default: de); Alias: default_language.
default_lang: de

# Polyglot: Sprachlabels; Default: Sprachcode.
# jekyll-legacy:1.0 verwendet stattdessen _data/languages.yml für die Sprachkonfiguration.
language_labels:
  de: Deutsch
  en: English

# Polyglot: YAML-Datei mit editierbaren Front-Matter-Feldern; Default: keine.
# editable_headers_file: editable-headers.yml

# --- Templates und AI-Kontext ---

# _tpl-Verzeichnis: init/install/revert/adjust und Onsite-AI (read-only).
# Zielstruktur für AI; Mock-Texte und Beispieldaten durch echte Inhalte ersetzen.
template_dir: node_modules/@leuffen/themejs2/_tpl

# AI-Skills: Verzeichnispfad oder Liste; Default: ThemeJS2-Skills.
skills_dir:
  - node_modules/@leuffen/themejs2/skills
  # - .shiller-skills

# AI-Kontext (read-only): Datei oder geordnete Liste; [] = aus.
# Default: project.md wie unten, falls vorhanden. Adjust benötigt Kontext.
context_files: .shiller-context.d/project.md
# Alternativ:
# context_files:
#   - .shiller.d/static-context.md # Technik und allgemeine Regeln, keine Stammdaten.
#   - .shiller-context.d/project.md # Aufbereiteter Projektkontext.

# AI-User-Kontext: bestätigte individuelle Fakten und dauerhafte Benutzerregeln.
# Global / Page: <Quellpfad>; Onsite-Text-Edits speichern nur nach Zustimmung.
# Vorhandene Markdown-Datei; null/'' = aus (Default).
# user_rules_file: .shiller.d/user-rules.md
user_rules_file: null

# --- AI Harness ---

ai:
  # Modell-ID; Factory-Default: gpt-6.1-sol; Workflow-Overrides möglich.
  # model: gpt-6.1-sol

  # Registrierter Harness-Client; Default: Standardclient.
  # client: 'openai:'

  # Reasoning: none, minimal, low, medium (Default), high, xhigh.
  reasoning_effort: medium

  # Web-Tool für AI; true/false (Default). Onsite: nur auf Nutzerwunsch.
  web_access: false

  # HTTP-Timeout in Sekunden (>0); Default: Harness-Client.
  # timeout: 90

  # Connect-Timeout in Sekunden (>0); Default: Harness-Client.
  # connect_timeout: 12

# --- Onsite Editor ---

onsite_editor:
  # Zusätzlicher SystemPrompt aus Datei; null/'' = aus (Default).
  # instruction_file: .shiller-onsite-editor.md
  instruction_file: null

# --- CLI ---

hooks:
  init:
    # Shell-Befehlslisten vor/nach Template-Kopie bei shiller init.
    before: []
    after: []

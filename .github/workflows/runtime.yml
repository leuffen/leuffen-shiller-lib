name: Schiller Runtime

on:
  push:
    branches: ["feat/schiller-runtime"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: yaml
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: find src test -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit
